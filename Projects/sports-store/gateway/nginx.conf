server {
    listen 80;
    client_max_body_size 2m;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/auth/ {
        proxy_pass http://auth:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/products {
        proxy_pass http://catalog:8000;
        include /etc/nginx/proxy_params.conf;
    }

    # Internal endpoints exposed for course demos only — a production
    # gateway would keep these private to the service network.
    location /api/internal/ {
        proxy_pass http://catalog:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/cart {
        proxy_pass http://cart:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/orders {
        proxy_pass http://order:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/payments {
        proxy_pass http://payment:8000;
        include /etc/nginx/proxy_params.conf;
    }
}
