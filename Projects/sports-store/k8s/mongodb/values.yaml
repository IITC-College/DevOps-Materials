# Values for the Bitnami mongodb chart (oci://registry-1.docker.io/bitnamicharts/mongodb).
# fullnameOverride keeps the Service name "mongo" so it matches MONGO_URI
# in k8s/01-secret.yaml (mongodb://root:...@mongo:27017/...) without
# touching app code.
fullnameOverride: mongo

architecture: standalone

# Root password comes from the app-secrets Secret (k8s/01-secret.yaml,
# key "mongodb-root-password") instead of being duplicated here — that
# Secret must be applied before `helm install`. Services read the matching
# full connection string from the same Secret's MONGO_URI key.
auth:
  enabled: true
  existingSecret: app-secrets

persistence:
  enabled: true
  size: 2Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
