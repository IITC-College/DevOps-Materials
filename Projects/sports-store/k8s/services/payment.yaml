apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: sports-store
  labels:
    app: payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - name: payment
          image: lironefitoussi/sports-store-payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef: { name: app-secrets, key: MONGO_URI }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: app-secrets, key: JWT_SECRET }
            - name: PAYMENT_FAILURE_SUFFIX
              valueFrom:
                configMapKeyRef: { name: app-config, key: PAYMENT_FAILURE_SUFFIX }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: sports-store
spec:
  selector:
    app: payment
  ports:
    - port: 8000
      targetPort: 8000
