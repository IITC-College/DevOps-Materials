apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: sports-store
data:
  # "mongo" is the Service name installed by the Helm release (see k8s/mongodb).
  MONGO_URI: mongodb://mongo:27017
  CATALOG_URL: http://catalog:8000
  CART_URL: http://cart:8000
  PAYMENT_URL: http://payment:8000
  SHIPPING_FLAT_RATE: "5.00"
  FREE_SHIPPING_THRESHOLD: "100"
  PAYMENT_FAILURE_SUFFIX: "0000"
