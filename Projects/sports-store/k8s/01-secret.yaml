# Dev defaults only — mirrors .env.example. Override JWT_SECRET before
# deploying anywhere beyond local/course use:
#   kubectl create secret generic app-secrets -n sports-store \
#     --from-literal=JWT_SECRET=<value> --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: sports-store
type: Opaque
stringData:
  JWT_SECRET: dev-secret-change-me
