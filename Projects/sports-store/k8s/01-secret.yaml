# Dev defaults only — mirrors .env.example. Override before deploying
# anywhere beyond local/course use:
#   kubectl create secret generic app-secrets -n sports-store \
#     --from-literal=JWT_SECRET=<value> \
#     --from-literal=mongodb-root-password=<value> \
#     --from-literal=MONGO_URI=mongodb://root:<value>@mongo:27017/?authSource=admin \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# mongodb-root-password is read directly by the Helm release (k8s/mongodb,
# auth.existingSecret: app-secrets) — must exist before `helm install`.
# MONGO_URI must embed the same password; the two are not derived from each
# other automatically, keep them in sync if you change one.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: sports-store
type: Opaque
stringData:
  JWT_SECRET: dev-secret-change-me
  mongodb-root-password: dev-mongo-pw-change-me
  MONGO_URI: mongodb://root:dev-mongo-pw-change-me@mongo:27017/?authSource=admin
