# One-shot job, mirrors the compose "seed" service (restart: "no").
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: sports-store
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: lironefitoussi/sports-store-seed:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef: { name: app-secrets, key: MONGO_URI }
