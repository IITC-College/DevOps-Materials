name: sports-store CI

on:
  push:
    branches: [main, master, "claude/**"]
    paths:
      - "Projects/sports-store/**"
      - ".github/workflows/sports-store-ci.yml"
  pull_request:
    paths:
      - "Projects/sports-store/**"
      - ".github/workflows/sports-store-ci.yml"

env:
  JWT_SECRET: test-secret

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - catalog-service
          - cart-service
          - order-service
          - payment-service
    defaults:
      run:
        working-directory: Projects/sports-store/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Projects/sports-store/services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projects/sports-store/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Projects/sports-store/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
