apiVersion: v1
kind: Pod
metadata:
  name: red-pod
  namespace: default
  labels:
    lab: manual-scheduling
    color: red
spec:
  schedulerName: manual-scheduler
  containers:
    - name: nginx
      image: nginx:1.27-alpine
